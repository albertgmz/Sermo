<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Offline - Sin conexión</title>
<style>
:root{--bg:#fafafa;--fg:#18181b;--muted:#52525b;--accent:#b91c1c;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#151521;--fg:#f4f4f8;--muted:#a1a5b7;--accent:#dc2626;--on-accent:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:26rem;text-align:center}
h1{margin:0 0 .5rem;font-size:1.5rem;line-height:1.25}
p{margin:0 0 1rem;color:var(--muted)}
section+section{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--muted)}
button{min-height:44px;padding:0 1.5rem;border:0;border-radius:.5rem;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
html.only-en section[lang=es],html.only-es section[lang=en]{display:none}
</style>
</head>
<body>
<main>
<section lang="en">
<h1>You are offline</h1>
<p>This page could not be loaded because there is no connection. Check your network and try again.</p>
<button type="button" data-retry>Try again</button>
</section>
<section lang="es">
<h1>Sin conexión</h1>
<p>No se pudo cargar esta página porque no hay conexión. Revisa tu red e inténtalo de nuevo.</p>
<button type="button" data-retry>Reintentar</button>
</section>
</main>
<script>
(function () {
  var language = (navigator.language || "").slice(0, 2).toLowerCase();
  var root = document.documentElement;
  if (language === "es") { root.lang = "es"; root.className = "only-es"; }
  else if (language === "en") { root.className = "only-en"; }
  document.addEventListener("click", function (event) {
    if (event.target instanceof Element && event.target.closest("[data-retry]")) location.reload();
  });
})();
</script>
</body>
</html>

# Three services, one published port: ingress -> web (pages) and sermo (API). Only the ingress
# publishes a port. The backend trusts the client address in x-forwarded-for because nothing but
# the ingress and web can reach it, so never add `ports:` to sermo or web.

services:
  sermo:
    build: .
    env_file:
      - .env
    environment:
      PORT: "3000"
      SERMO_DB_PATH: /data/sermo.db
      SERMO_FILES_DIR: ${SERMO_FILES_DIR:-/data/files}
      # The ingress sets x-forwarded-for; the backend takes the address from it.
      SERMO_TRUSTED_PROXY_HEADER: x-forwarded-for
      # The web app resolves the visitor while rendering, where it cannot store a refreshed cookie.
      SERMO_SESSION_COOKIE_CACHE: "false"
    volumes:
      - sermo_data:/data
    restart: unless-stopped
    # Shutdown waits up to 30 s for a running job (such as an email send) to finish.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      SERMO_API_URL: http://sermo:3000
      SERMO_PUBLIC_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
    depends_on:
      sermo:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      # The server accepts connections: the check does not depend on the backend.
      test: ["CMD", "node", "-e", "require('node:net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingress:
    image: caddy:2-alpine
    user: "65532:65532"
    read_only: true
    # The caddy binary carries the bind capability, so exec fails without it.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      INGRESS_MAX_BODY: ${INGRESS_MAX_BODY:-32MiB}
    ports:
      - "${INGRESS_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=65532,gid=65532
    depends_on:
      sermo:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sermo_data:

services:
  sermo:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      SERMO_DB_PATH: /data/sermo.db
      SERMO_FILES_DIR: ${SERMO_FILES_DIR:-/data/files}
    volumes:
      - sermo_data:/data
    restart: unless-stopped
    # Shutdown waits up to 30 s for a running job (such as an email send) to finish.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  sermo_data:
